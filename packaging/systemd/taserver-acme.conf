# Optional /etc/systemd/system/taserver.service.d/acme.conf.
# REQUIRED: replace YOUR.SERVER.NAME with your public DNS hostname before enabling. --acme-agree-tos records the
# operator's acceptance of the CA subscriber agreement.
# Initial issuance/backoff retries in-process; transient CA errors do not consume
# the base service restart allowance. Game connections wait for the certificate.
[Service]
LoadCredential=
ExecStart=
ExecStart=/usr/bin/taserver \
    --data ${TA_SERVER_DATA} \
    --accounts ${TA_SERVER_ACCOUNTS} \
    --map-cache-dir ${TA_SERVER_MAP_CACHE} \
    --replaydir ${TA_SERVER_REPLAYS} \
    --port ${TA_SERVER_PORT} \
    --max-games ${TA_SERVER_MAX_GAMES} \
    --max-running-games ${TA_SERVER_MAX_RUNNING_GAMES} \
    --max-accounts ${TA_SERVER_MAX_ACCOUNTS} \
    --map-memory-mib ${TA_SERVER_MAP_MEMORY_MIB} \
    --map-storage-mib ${TA_SERVER_MAP_STORAGE_MIB} \
    --replay-memory-mib ${TA_SERVER_REPLAY_MEMORY_MIB} \
    --replay-storage-mib ${TA_SERVER_REPLAY_STORAGE_MIB} \
    --acme-domain YOUR.SERVER.NAME \
    --acme-agree-tos \
    --acme-state /var/lib/taserver/acme \
    $TA_SERVER_EXTRA_ARGS
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
