name: macOS build
run-name: macOS build · ${{ github.ref_name }}

# Builds native macOS ARM64 (Apple Silicon): uploads a CI artifact and runs the
# determinism gate; on a tag it also attaches the zipped bundle to the GitHub Release.

# Runs on every push to main AS WELL AS on a version tag. It used to be tag-only,
# to keep per-commit CI fast -- and that is how a std::atomic_ref that Apple's libc++
# does not have sat broken in sim.cpp from the commit that introduced it until the
# v0.6.5 tag tried to build it, with a green determinism gate the whole time. A
# platform break is only cheap to fix while you still remember what caused it. The
# release steps below stay guarded on a tag ref, so a main push builds and tests but
# publishes nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS ARM64
    runs-on: macos-14   # Apple Silicon (ARM64)
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja pkg-config

      # Minimal static Bink-only FFmpeg so the bundle plays the door videos with no
      # runtime FFmpeg (see tools/build-ffmpeg-bink.sh). Cached by FFmpeg version.
      - name: Cache static FFmpeg (Bink)
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-bink
          key: ffmpeg-bink-macos-arm64-n7.1.1
      - name: Build static FFmpeg (Bink)
        run: ./tools/build-ffmpeg-bink.sh
      # Static zlib/libjpeg/SDL2 (built from source, like Linux) so the binary is fully
      # self-contained -- no Homebrew dylibs referenced. SDL2 still links the system
      # frameworks (Cocoa/Metal/CoreAudio/...), which macOS forbids linking statically.
      - name: Cache static deps (zlib/libjpeg/SDL2)
        uses: actions/cache@v4
        with:
          path: third_party/static-deps
          key: static-deps-macos-arm64-zlib1.3.1-jpeg3.0.4-sdl2.32.10
      - name: Build static deps (zlib/libjpeg/SDL2)
        run: ./tools/build-static-deps.sh

      - name: Configure + build
        # FIND_FRAMEWORK=LAST keeps FindJPEG off Mono.framework's ancient libjpeg; the
        # vendored static zlib/jpeg/SDL2 (TAK_STATIC_LIBS) are found via the prefix.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAK_STATIC_FFMPEG=ON \
            -DTAK_STATIC_LIBS=ON -DCMAKE_FIND_FRAMEWORK=LAST
          cmake --build build --target takclient takserver detmath_test sim_driver_equiv_test

      - name: Verify fully static (only system libs/frameworks linked)
        run: |
          otool -L build/takclient
          # macOS can't static-link libSystem/frameworks, so those are expected; assert
          # NO Homebrew/@rpath/local dylib (SDL2/jpeg/zlib/ffmpeg must be baked in).
          if otool -L build/takclient | tail -n +2 | grep -qE '@rpath|@loader_path|/opt/homebrew|/usr/local'; then
            echo "::error::takclient links a non-system dylib -- not fully static"; exit 1
          fi
          echo "OK: only system libs/frameworks linked -- as static as macOS allows"

      - name: Project version
        run: echo "VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      # Drag-and-drop disk image: a "TAK Engine.app" bundle (Finder-launchable
      # with NO Terminal window -- only .app bundles get that; a bare Unix binary
      # double-clicked in Finder always opens Terminal) plus an /Applications
      # symlink, packed with hdiutil. Ad-hoc codesigned so Apple Silicon will run
      # it (users still right-click > Open the first time -- we don't hold a
      # notarization identity).
      - name: App bundle + DMG
        run: |
          APPDIR="dist-dmg/TAK Engine.app"
          mkdir -p "$APPDIR/Contents/MacOS"
          cp build/takclient build/takserver "$APPDIR/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APPDIR/Contents/Info.plist"
          plutil -lint "$APPDIR/Contents/Info.plist"
          codesign --force --deep -s - "$APPDIR"
          ln -s /Applications dist-dmg/Applications
          hdiutil create -volname "TAK Engine" -srcfolder dist-dmg -ov -format UDZO \
            "tak-engine-$VERSION-macos-arm64.dmg"
          hdiutil verify "tak-engine-$VERSION-macos-arm64.dmg"

      # The zip carries the SAME .app (launch that from Finder -- no Terminal)
      # plus the bare binaries for people who want the CLI/server.
      - name: Bundle + zip
        run: |
          mkdir -p dist-macos
          cp -R "dist-dmg/TAK Engine.app" dist-macos/
          cp build/takclient build/takserver dist-macos/
          (cd dist-macos && zip -ry "../takclient-$VERSION-macos-arm64.zip" .)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: takclient-macos-arm64
          path: dist-macos/

      - name: Upload CI artifact (DMG)
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-macos-arm64-dmg
          path: tak-engine-*.dmg

      # Debug build: the release binaries are hardened (only --data/--version, no env
      # vars), so ship an unhardened DEBUG bundle for devs who need the CLI flags,
      # TAK_* env hooks, and the headless --mp* harness.
      - name: Configure + build (debug)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTAK_STATIC_FFMPEG=ON \
            -DTAK_STATIC_LIBS=ON -DCMAKE_FIND_FRAMEWORK=LAST
          cmake --build build-debug --target takclient takserver

      - name: Bundle + zip (debug)
        run: |
          mkdir -p dist-macos-debug
          cp build-debug/takclient build-debug/takserver dist-macos-debug/
          (cd dist-macos-debug && zip -r ../takclient-macos-arm64-debug.zip .)

      - name: Upload CI artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: takclient-macos-arm64-debug
          path: dist-macos-debug/

      - name: Determinism gate (cross-platform parity)
        run: |
          expected=ab1ef54ae324bd0e
          ./build/detmath_test    # accuracy vs libm (fails on tolerance)
          got=$(./build/detmath_test --hash | grep -oE '[0-9a-f]{16}')
          echo "detmath golden: $got (expected $expected)"
          if [ "$got" != "$expected" ]; then
            echo "::error::detmath golden mismatch -- cross-platform lockstep broken"
            exit 1
          fi
          ./build/sim_driver_equiv_test

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            "takclient-$VERSION-macos-arm64.zip" takclient-macos-arm64-debug.zip \
            "tak-engine-$VERSION-macos-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" --clobber
