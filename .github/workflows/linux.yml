name: Linux packages
run-name: Linux packages · ${{ github.ref_name }}

# Builds native per-distro Linux packages: .debs for Ubuntu 22.04/24.04/26.04 + Debian 12/13, an .rpm for
# Fedora 44, and a pacman .pkg.tar.zst for Arch -- each compiled INSIDE that
# distro's container so glibc and package metadata match the target. SDL2/jpeg/
# zlib and the Bink FFmpeg are statically linked (built from source;
# -DTAK_STATIC_LIBS=ON + -DTAK_STATIC_FFMPEG=ON), so the packages are otherwise
# self-contained. Every leg uploads a CI artifact; the release job attaches them
# all to the GitHub Release on a tag.

# Runs on every push to main AS WELL AS on a version tag. It used to be tag-only,
# to keep per-commit CI fast -- and that is how a std::atomic_ref that Apple's libc++
# does not have sat broken in sim.cpp from the commit that introduced it until the
# v0.6.5 tag tried to build it, with a green determinism gate the whole time. A
# platform break is only cheap to fix while you still remember what caused it. The
# release steps below stay guarded on a tag ref, so a main push builds and tests but
# publishes nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # debug=true on the OLDEST glibc leg: its unhardened debug tarball runs
          # everywhere. cmake_dl: ubuntu 22.04 ships cmake 3.22 (< our 3.24 min);
          # cxx12: its default g++ is 11, too old for our C++20.
          - { name: 'Ubuntu 22.04 (.deb)', image: 'ubuntu:22.04', family: deb,
              tag: ubuntu22.04, debug: true, cmake_dl: true, cxx12: true }
          - { name: 'Ubuntu 24.04 (.deb)', image: 'ubuntu:24.04', family: deb, tag: ubuntu24.04 }
          - { name: 'Ubuntu 26.04 (.deb)', image: 'ubuntu:26.04', family: deb, tag: ubuntu26.04 }
          - { name: 'Debian 12 (.deb)',    image: 'debian:12',    family: deb, tag: debian12 }
          - { name: 'Debian 13 (.deb)',    image: 'debian:13',    family: deb, tag: debian13 }
          - { name: 'Fedora 44 (.rpm)',    image: 'fedora:44',    family: rpm, tag: fedora44 }
          - { name: 'Arch (.pkg.tar.zst)', image: 'archlinux:latest', family: arch, tag: arch }
    steps:
      # Deps FIRST (before checkout: the checkout action needs nothing from us,
      # but the containers lack git/curl until this runs).
      - name: Install build deps (apt)
        if: matrix.family == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # Build tools + the SDL2 backend -dev headers needed to BUILD a static
          # SDL2 with its X11/Wayland/audio drivers (the libs themselves are
          # built from source below).
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git make dpkg-dev nasm pkg-config file \
            curl ca-certificates xz-utils \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev
          if [ "${{ matrix.cxx12 }}" = "true" ]; then apt-get install -y g++-12; fi
      - name: Install build deps (dnf)
        if: matrix.family == 'rpm'
        run: |
          # libstdc++-static: Fedora splits libstdc++.a out, and without it the
          # -static-libstdc++ probe in CMakeLists fails and the binary keeps a
          # libstdc++.so.6 dependency -- which is exactly what the static gate rejects.
          dnf -y install cmake ninja-build gcc-c++ git make rpm-build nasm pkgconf \
            libstdc++-static \
            tar gzip zstd xz \
            alsa-lib-devel pulseaudio-libs-devel pipewire-devel dbus-devel \
            libX11-devel libXext-devel libXcursor-devel libXi-devel libXrandr-devel \
            libXfixes-devel libXScrnSaver-devel libxkbcommon-devel wayland-devel \
            wayland-protocols-devel libdecor-devel mesa-libGL-devel mesa-libEGL-devel
      - name: Install build deps (pacman)
        if: matrix.family == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git nasm pkgconf curl \
            alsa-lib libpulse pipewire dbus \
            libx11 libxext libxcursor libxi libxrandr libxfixes libxss \
            libxkbcommon wayland wayland-protocols libdecor mesa

      - uses: actions/checkout@v7

      # Ubuntu 22.04 ships CMake 3.22; our minimum is 3.24. Drop in the official
      # binary tarball (x86_64) ahead of it on PATH.
      - name: Newer CMake (ubuntu 22.04)
        if: matrix.cmake_dl == true
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz
          tar -C /opt -xzf /tmp/cmake.tar.gz
          ln -sf /opt/cmake-3.28.6-linux-x86_64/bin/cmake /usr/local/bin/cmake
          ln -sf /opt/cmake-3.28.6-linux-x86_64/bin/cpack /usr/local/bin/cpack
          cmake --version

      # Static Bink-only FFmpeg + static zlib/libjpeg/SDL2 (see the tools/
      # scripts): built inside THIS distro's container, cached per distro.
      - name: Cache static FFmpeg (Bink)
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-bink
          key: ffmpeg-bink-${{ matrix.tag }}-n7.1.1
      - name: Build static FFmpeg (Bink)
        run: ./tools/build-ffmpeg-bink.sh
      - name: Cache static deps (zlib/libjpeg/SDL2)
        uses: actions/cache@v4
        with:
          path: third_party/static-deps
          key: static-deps-${{ matrix.tag }}-zlib1.3.1-jpeg3.0.4-sdl2.32.10
      - name: Build static deps (zlib/libjpeg/SDL2)
        run: ./tools/build-static-deps.sh

      - name: Configure + build
        run: |
          if [ "${{ matrix.cxx12 }}" = "true" ]; then export CC=gcc-12 CXX=g++-12; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTAK_STATIC_FFMPEG=ON -DTAK_STATIC_LIBS=ON \
            -DTAK_DISTRO_TAG=${{ matrix.tag }}
          # Every target the Linux install() rules reference, or cpack fails at
          # package time with "file INSTALL cannot find build/<target>" -- which is
          # exactly how 0.6.0 broke when cartographer joined those rules.
          cmake --build build --target takclient takserver cartographer

      # Windows and macOS each gate on their binaries being static; Linux did not, and it
      # is the platform where a leak is most costly: CPack derives package dependencies
      # from what the binary links (SHLIBDEPS/AUTOREQ), so an SDL2 or libstdc++ that
      # quietly went dynamic becomes an install-time requirement on every user's machine.
      # libc/libm are expected -- glibc's NSS and SDL2's backends are dlopen'd, so a
      # fully static binary could not resolve a host or open a window.
      - name: Verify fully static (only libc/libm linked)
        run: |
          ldd build/takclient build/takserver || true
          leaked=$(ldd build/takclient build/takserver \
            | awk '/=>/{print $1}' | sort -u \
            | grep -vE '^(libc|libm|libdl|libpthread|librt)\.so|^linux-vdso|^/lib64/ld-' || true)
          if [ -n "$leaked" ]; then
            echo "::error::takclient/takserver link non-libc shared libraries:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: only libc/libm linked -- as static as a Linux build can usefully be"

      - name: Package (.deb)
        if: matrix.family == 'deb'
        run: |
          (cd build && cpack -G DEB)
          dpkg-deb -I build/tak-engine-*.deb   # show control + auto deps
          mkdir -p dist && cp build/tak-engine-*.deb dist/
      - name: Package (.rpm)
        if: matrix.family == 'rpm'
        run: |
          (cd build && cpack -G RPM)
          rpm -qp --requires build/tak-engine-*.rpm
          mkdir -p dist && cp build/tak-engine-*.rpm dist/
      - name: Package (.pkg.tar.zst)
        if: matrix.family == 'arch'
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          sed -i "s/@VERSION@/$VERSION/" packaging/arch/PKGBUILD
          # makepkg refuses to run as root: hand the tree to a build user.
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && makepkg -f --nodeps'
          pacman -Qip packaging/arch/tak-engine-*.pkg.tar.zst
          mkdir -p dist && cp packaging/arch/tak-engine-*.pkg.tar.zst dist/

      # Debug tarball from the oldest-glibc leg only: the release binaries are
      # hardened (only --data/--version, no env vars), so devs get an unhardened
      # DEBUG build with the CLI flags, TAK_* env hooks, and the --mp* harness.
      - name: Build + tar the debug binaries
        if: matrix.debug == true
        run: |
          export CC=gcc-12 CXX=g++-12
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTAK_STATIC_FFMPEG=ON -DTAK_STATIC_LIBS=ON
          cmake --build build-debug --target takclient takserver
          mkdir -p dist-linux-debug
          cp build-debug/takclient build-debug/takserver dist-linux-debug/
          tar -C dist-linux-debug -czf dist/tak-engine-linux-x64-debug.tar.gz .

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-${{ matrix.tag }}
          path: dist/*

  release:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tak-engine-*
          merge-multiple: true
          path: dist
      - name: Create release + upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
